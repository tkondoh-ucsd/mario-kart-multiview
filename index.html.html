<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mario Kart MultiView Sync</title><style>
:root{color-scheme:dark;font-family:system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#e9eefb}header,.controls,.inputs{padding:12px 18px;background:#151e32}header{display:flex;align-items:center;justify-content:space-between}h1{font-size:18px;margin:0}button,input,select{font:inherit}button{background:#416de5;color:white;border:0;border-radius:7px;padding:9px 12px;cursor:pointer}button.secondary{background:#34415b}input{background:#0e1629;border:1px solid #526079;border-radius:6px;color:white;padding:8px;min-width:0}.inputs{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:8px}.entry{display:grid;grid-template-columns:1fr 90px;gap:6px}.entry label{grid-column:1/-1;font-size:12px;color:#b9c7e2}.layout{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:8px;align-content:center;min-height:50vh}.tile{background:#000;aspect-ratio:16/9;position:relative;overflow:hidden}.tile>div{position:absolute;inset:0}.tile iframe{width:100%;height:100%}.tile{overflow:visible;margin-bottom:35px}.tile-info{position:absolute;top:100%;left:0;right:0;height:34px;background:#1c2942;display:flex;align-items:center;gap:5px;padding:3px 7px;font-size:12px}.tile-info button{padding:3px 7px;font-size:11px;background:#344b70}.tile-info .current{margin-right:auto;font-variant-numeric:tabular-nums}.obs .tile{margin-bottom:0;overflow:hidden}.obs .tile-info{display:none}.empty{border:1px dashed #41516c;background:#11192a}.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.controls input[type=range]{flex:1;min-width:140px}.time{font-variant-numeric:tabular-nums;font-size:13px}.note{font-size:12px;color:#aabbd7;padding:0 18px 12px}.obs .inputs,.obs .controls,.obs header,.obs .note{display:none}.obs .layout{height:100vh;padding:4px;gap:4px}.obs .tile{align-self:center}body.two .layout{grid-template-columns:1fr;max-width:min(100vw,1100px);margin:auto}body.two.obs .layout{height:100vh}body.two .tile{max-height:calc(50vh - 8px);margin:auto;width:min(100%,calc((50vh - 8px)*16/9))}#status{font-size:12px;color:#f3cf8a}select{background:#34415b;color:white;padding:8px;border:0;border-radius:6px}@media(max-width:600px){.layout{gap:3px;padding:3px}.controls{padding:10px}}
</style></head><body><header><h1>Mario Kart MultiView Sync</h1><button id="obsBtn" class="secondary">OBSモード</button></header><section class="inputs" id="inputs"></section><section class="controls"><button id="load">動画を読み込む</button><button id="play">再生</button><button id="pause" class="secondary">停止</button><button id="back" class="secondary">−10秒</button><button id="forward" class="secondary">＋10秒</button><input id="seek" aria-label="再生位置" type="range" min="0" max="100" step="0.1" value="0"><span id="clock" class="time">00:00</span><label>速度 <select id="speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option><option value="2">2×</option></select></label><label>音声 <select id="audio"><option value="-1">なし</option><option value="0" selected>①</option><option value="1">②</option><option value="2">③</option><option value="3">④</option></select></label><button id="capture" class="secondary">現在の位置を同期基準に登録</button><button id="sync" class="secondary">再同期</button><span id="status"></span></section><section class="layout" id="layout"></section><p class="note">開始時刻には各アーカイブで同じ瞬間が映る時刻を入力（例 12:30）。各動画を同じ瞬間で一時停止したら「現在の位置を同期基準に登録」を押してください。その後「再同期」「再生」の順に押します。各視点の下に現在時刻と個別同期調整ボタンを表示します。＋はその視点を先へ進め、−は戻します。URLは2〜4本。動画の埋め込みが許可されている必要があります。OBSモードは Esc キーで解除できます。</p><script>
const $=id=>document.getElementById(id), state={players:[],offsets:[],duration:0,ready:0,loaded:false,seeking:false,playing:false,indices:[]};
function parseTime(s){s=s.trim();if(!s)return 0;const p=s.split(':').map(Number);if(p.some(n=>!Number.isFinite(n)||n<0)||p.length>3)return NaN;return p.reduce((a,b)=>a*60+b,0)}
function fmtInput(t){const whole=fmt(t);const tenth=Math.round((Math.max(0,t)%1)*10);return tenth?whole+'.'+tenth:whole}
function fmtPrecise(t){if(!Number.isFinite(t))return '--:--.-';return fmt(t)+'.'+Math.floor((Math.max(0,t)%1)*10)}
function fmt(t){t=Math.max(0,Math.floor(t));const h=Math.floor(t/3600),m=Math.floor(t%3600/60),s=t%60;return(h?`${h}:`:'')+`${h?String(m).padStart(2,'0'):m}:${String(s).padStart(2,'0')}`}
function videoId(url){try{const u=new URL(url);const host=u.hostname.replace(/^www\./,'');if(host==='youtu.be')return u.pathname.slice(1).split('/')[0];if(host==='youtube.com'||host==='m.youtube.com'||host==='music.youtube.com'||host==='youtube-nocookie.com'){if(u.pathname==='/watch')return u.searchParams.get('v');const m=u.pathname.match(/^\/(?:live|shorts|embed)\/([^/]+)/);return m?.[1]||null}}catch{}return null}
function status(t){$('status').textContent=t}
for(let i=0;i<4;i++){$('inputs').insertAdjacentHTML('beforeend',`<div class="entry"><label>視点${i+1} URL / 同期開始時刻</label><input id="url${i}" placeholder="https://www.youtube.com/watch?v=..."/><input id="offset${i}" value="0:00" placeholder="12:30"/></div>`)}
const storageKey='mk-multiview-settings-v2';
function saveSettings(){try{localStorage.setItem(storageKey,JSON.stringify({urls:Array.from({length:4},(_,i)=>$(`url${i}`).value),offsets:Array.from({length:4},(_,i)=>$(`offset${i}`).value),audio:$('audio').value,speed:$('speed').value}))}catch{}}
try{const saved=JSON.parse(localStorage.getItem(storageKey)||'null');if(saved){for(let i=0;i<4;i++){$(`url${i}`).value=saved.urls?.[i]||'';$(`offset${i}`).value=saved.offsets?.[i]||'0:00'}if(saved.audio!==undefined)$('audio').value=saved.audio;if(saved.speed)$('speed').value=saved.speed}}catch{}
$('inputs').addEventListener('change',saveSettings);
const tag=document.createElement('script');tag.src='https://www.youtube.com/iframe_api';document.head.append(tag);let apiReady=false;window.onYouTubeIframeAPIReady=()=>{apiReady=true;status('YouTube API準備完了')};
function pos(){const p=state.players[0];return p&&state.ready===state.players.length?Math.max(0,p.getCurrentTime()-state.offsets[0]):0}
function updateTileTimes(){state.players.forEach((p,i)=>{const el=$(`current${i}`);if(el){try{el.textContent=`視点${state.indices[i]+1}  ${fmtPrecise(p.getCurrentTime())}`}catch{}}})}
function adjust(i,delta){if(state.ready!==state.players.length||!state.players[i])return;const t=pos();const next=Math.max(0,Math.round((state.offsets[i]+delta)*10)/10);state.offsets[i]=next;$(`offset${state.indices[i]}`).value=fmtInput(next);state.players[i].seekTo(t+next,true);if(!state.playing)state.players[i].pauseVideo();saveSettings();updateTileTimes();status(`視点${state.indices[i]+1}を${delta>0?'+':''}${delta}秒調整`)}
function capture(){if(!state.players.length||state.ready!==state.players.length){status('動画の準備ができてから登録してね');return}pause();const times=state.players.map(p=>p.getCurrentTime());if(times.some(t=>!Number.isFinite(t))){status('時刻を取得できなかったよ');return}state.offsets=times.map(t=>Math.round(t*10)/10);state.offsets.forEach((t,i)=>{$(`offset${state.indices[i]}`).value=fmtInput(t)});saveSettings();$('seek').value=0;$('clock').textContent='0:00';updateTileTimes();status('現在の各動画の位置を同期基準として保存したよ。再生を押してね')}
function seek(t){t=Math.max(0,t);state.players.forEach((p,i)=>{if(p?.seekTo){p.seekTo(t+state.offsets[i],true);if(!state.playing)p.pauseVideo()}});$('clock').textContent=fmt(t)}
function audio(){const chosen=Number($('audio').value);state.players.forEach((p,i)=>{if(i===chosen)p.unMute();else p.mute()})}
function speed(){const v=Number($('speed').value);state.players.forEach(p=>p.setPlaybackRate(v))}
function play(){state.playing=true;state.players.forEach(p=>p.playVideo());status('再生中')}
function pause(){state.playing=false;state.players.forEach(p=>p.pauseVideo());status('一時停止')}
$('load').onclick=()=>{if(!apiReady){status('API読み込み中。数秒後に再試行してね');return}const entries=[];for(let i=0;i<4;i++){const u=$(`url${i}`).value.trim();if(!u)continue;const id=videoId(u),offset=parseTime($(`offset${i}`).value);if(!id||!Number.isFinite(offset)){status(`視点${i+1}のURLまたは時刻が不正`);return}entries.push({id,offset,index:i})}if(entries.length<2){status('URLを2〜4本入力してね');return}state.players.forEach(p=>{try{p.destroy()}catch{}});state.players=[];state.offsets=entries.map(e=>e.offset);state.indices=entries.map(e=>e.index);saveSettings();state.ready=0;state.loaded=true;state.playing=false;state.duration=0;$('layout').replaceChildren();document.body.classList.toggle('two',entries.length===2);entries.forEach((e,i)=>{const tile=document.createElement('div');tile.className='tile';const holder=document.createElement('div');holder.id=`player${i}`;tile.append(holder);const info=document.createElement('div');info.className='tile-info';info.innerHTML=`<span class="current" id="current${i}">視点${e.index+1} --:--.-</span><button type="button" data-delta="-0.5">−0.5秒</button><button type="button" data-delta="-0.1">−0.1秒</button><button type="button" data-delta="0.1">＋0.1秒</button><button type="button" data-delta="0.5">＋0.5秒</button>`;info.querySelectorAll('button').forEach(b=>b.onclick=()=>adjust(i,Number(b.dataset.delta)));tile.append(info);$('layout').append(tile)});if(entries.length===3){const blank=document.createElement('div');blank.className='tile empty';$('layout').append(blank)}entries.forEach((e,i)=>{state.players[i]=new YT.Player(`player${i}`,{videoId:e.id,playerVars:{playsinline:1,controls:0,rel:0,origin:location.origin},events:{onReady(ev){state.ready++;ev.target.mute();ev.target.pauseVideo();ev.target.seekTo(e.offset,true);if(state.ready===entries.length){audio();speed();const lengths=state.players.map((p,j)=>Math.max(0,p.getDuration()-state.offsets[j])).filter(x=>x>0);state.duration=lengths.length?Math.min(...lengths):0;$('seek').max=state.duration||100;status('準備完了。再生を押してね')}},onError(){status(`視点${i+1}を再生できません。埋め込み制限を確認してね`)}}})})};
$('capture').onclick=capture;$('play').onclick=play;$('pause').onclick=pause;$('back').onclick=()=>seek(pos()-10);$('forward').onclick=()=>seek(pos()+10);$('sync').onclick=()=>{const t=pos();seek(t);if(state.playing)play();status('保存済みの同期基準に揃えたよ')};$('audio').onchange=()=>{audio();saveSettings()};$('speed').onchange=()=>{speed();saveSettings()};$('seek').oninput=()=>{state.seeking=true;$('clock').textContent=fmt(Number($('seek').value))};$('seek').onchange=()=>{seek(Number($('seek').value));state.seeking=false};$('obsBtn').onclick=()=>document.body.classList.toggle('obs');document.addEventListener('keydown',e=>{if(e.key==='Escape')document.body.classList.remove('obs')});setInterval(()=>{if(!state.loaded||state.ready!==state.players.length||state.seeking)return;updateTileTimes();const t=pos();$('seek').value=t;$('clock').textContent=fmt(t);if(state.playing){state.players.forEach((p,i)=>{const delta=p.getCurrentTime()-state.offsets[i]-t;if(Math.abs(delta)>0.8)p.seekTo(t+state.offsets[i],true)})}},500);
</script></body></html>
